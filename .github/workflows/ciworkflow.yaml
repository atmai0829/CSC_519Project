name: CI/CD Workflow
on:
  pull_request:
    branches: ["main", "dev", "release*"]
  push:
    branches: ["main", "dev", "release*"]
  jobs:
    lint-javascript:
      name: ESLint
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: "18.x"
            cache: "npm"
            cache-dependency-path: coffee-project/package-lock.json
        - name: Install dependencies
          working-directory: ./coffee-project
          run: npm ci
        - name: Run ESLint
          working-directory: ./coffee-project
          run: npm run lint

    lint-ansible:
      name: Ansible Lint
      runs-on: ubuntu-latest
      steps:
        - name: Run ansible-lint
          uses: ansible/ansible-lint@v25.8.2
