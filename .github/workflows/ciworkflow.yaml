name: CI/CD Workflow
on:
  pull_request:
    branches: ["main", "dev", "release*"]
  push:
    branches: ["main", "dev", "release*"]
jobs:
  setup:
    name: Setup Dependencies
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check Available Python Tools
        run: |
          echo "Checking available Python tools..."
          which python3 || echo "python3 not found"
          which pip || echo "pip not found"
          which pip3 || echo "pip3 not found"
          which apt || echo "apt not found"
          python3 --version || echo "python3 version check failed"
      - name: Install Ansible via Python
        run: |
          # Try different installation methods
          if command -v pip &> /dev/null; then
            pip install --user ansible-core docker
          elif command -v python3 &> /dev/null && python3 -m pip --version &> /dev/null; then
            python3 -m pip install --user ansible-core docker
          else
            echo "No pip available, trying alternative..."
            # Download and install pip
            curl https://bootstrap.pypa.io/get-pip.py -o get-pip.py
            python3 get-pip.py --user
            export PATH="$HOME/.local/bin:$PATH"
            pip install --user ansible-core docker
          fi

          # Add to PATH
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Install Docker collection
          ansible-galaxy collection install community.docker --user

  lint-javascript:
    name: ESLint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        working-directory: ./coffee-project
        run: npm install
      - name: Run ESLint
        working-directory: ./coffee-project
        run: npm run lint

  lint-ansible:
    name: Ansible Lint
    runs-on: self-hosted
    needs: [setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.8.2

  test:
    name: Runs Tests
    runs-on: self-hosted
    needs: [lint-javascript, lint-ansible]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        working-directory: ./coffee-project
        run: npm install
      - name: Run Tests
        working-directory: ./coffee-project
        run: npm test

  build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        working-directory: ./coffee-project
        run: docker build -t coffee-project:latest .

  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Ansible Playbook
        run: ansible-playbook -i ansible/hosts ansible/playbook.yaml
