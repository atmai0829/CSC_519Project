name: CI/CD Workflow
on:
  pull_request:
    branches: ["main", "dev", "release*"]
  push:
    branches: ["main", "dev", "release*"]
jobs:
  lint-javascript:
    name: ESLint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        working-directory: ./coffee-project
        run: npm install
      - name: Run ESLint
        working-directory: ./coffee-project
        run: npm run lint

  lint-ansible:
    name: Ansible Lint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.8.2

  test:
    name: Runs Tests
    runs-on: self-hosted
    needs: [lint-javascript, lint-ansible]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        working-directory: ./coffee-project
        run: npm install
      - name: Run Tests
        working-directory: ./coffee-project
        run: npm test

  build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        working-directory: ./coffee-project
        run: docker build -t coffee-project:latest .

  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Ansible Playbook
        run: ansible-playbook -i ansible/hosts ansible/playbook.yaml
