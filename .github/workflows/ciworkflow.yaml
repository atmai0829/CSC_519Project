name: CI/CD Workflow
on:
  pull_request:
    branches: ["main", "dev", "release*"]
  push:
    branches: ["main", "dev", "release*"]
jobs:
  lint-javascript:
    name: ESLint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        working-directory: ./coffee-project
        run: npm install
      - name: Run ESLint
        working-directory: ./coffee-project
        run: npm run lint

  lint-ansible:
    name: Ansible Lint
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ansible and ansible-lint
        run: |
          pip install ansible ansible-lint
      - name: Install community.docker
        run: |
          ansible-galaxy collection install community.docker
      - name: Run ansible-lint
        uses: ansible/ansible-lint@v25.8.2

  test:
    name: Runs Tests
    runs-on: self-hosted
    needs: [lint-javascript, lint-ansible]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Install dependencies
        working-directory: ./coffee-project
        run: npm install
      - name: Run Tests
        working-directory: ./coffee-project
        run: npm test

  build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        working-directory: ./coffee-project
        run: docker build -t coffee-project:latest .

  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs: [build]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and Dependencies
        run: |
          pip install ansible docker
          ansible-galaxy collection install community.docker

      - name: Setup SSH Key
        run: |
          # Create SSH key from secret
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

          # Create SSH config
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          echo "  HostName ${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          echo "  User ${{ secrets.SSH_USER }}" >> ~/.ssh/config
          echo "  IdentityFile /tmp/ssh_key" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Create Dynamic Hosts File
        run: |
          # Replace placeholders in hosts file with actual values
          sed -e "s/{{ SSH_HOST }}/${{ secrets.SSH_HOST }}/g" \
              -e "s/{{ SSH_USER }}/${{ secrets.SSH_USER }}/g" \
              ansible/hosts > /tmp/hosts

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i /tmp/hosts ansible/playbook.yaml

      - name: Cleanup SSH Key
        run: |
          rm -f /tmp/ssh_key /tmp/hosts
        if: always()
